name: Feature request
description: Suggest an improvement or new idea for PopPiP.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem and the value it would add.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is frustrating or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like PopPiP to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include screenshots, mockups, relevant websites, or examples from other apps.
